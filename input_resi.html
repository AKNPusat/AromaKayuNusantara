<!DOCTYPE html>
<html lang="id">
<head>
    <title>Input/Edit Data Pengiriman - PT. Aroma Kayu Nusantara</title>
    <link rel="stylesheet" href="kerangka.css">
    <link rel="stylesheet" href="form.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-wrapper">
        <div id="header-placeholder"></div>
        <main>
            <class="page-container">
                
             <div class="edit-form-container">
                        <form id="form-cari-edit">
                            <label for="resi-untuk-edit">Edit Data yang Sudah Ada?</label>
                            <div class="edit-input-group">
                                <input type="text" id="resi-untuk-edit" placeholder="Masukkan Nomor Resi...">
                                <button type="submit">Cari & Edit</button>
                            </div>
                        </form>
                    </div>
                
                    <form id="form-resi">
                        <h3>Informasi Pengiriman</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nomor-resi">Nomor Resi</label>
                                <input type="text" id="nomor-resi" placeholder="Contoh: 20250017" required>
                            </div>
                            <div class="form-group">
                                <label for="tanggal-kirim">Tanggal Kirim</label>
                                <input type="date" id="tanggal-kirim" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="jenis-armada">Jenis Armada</label>
                            <select id="jenis-armada" required>
                                <option value="kapal">Kapal (Laut)</option>
                                <option value="pesawat">Pesawat (Udara)</option>
                            </select>
                        </div>
                        
                        <h3>Detail Pengirim & Penerima</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nama-pengirim">Nama Pengirim</label>
                                <input type="text" id="nama-pengirim" placeholder="Contoh: Imin - Bifo" required>
                            </div>
                             <div class="form-group">
                                <label for="telp-pengirim">No. Telp Pengirim</label>
                                <input type="text" id="telp-pengirim">
                            </div>
                        </div>
                         <div class="form-row">
                            <div class="form-group">
                                <label for="nama-penerima">Nama Penerima</label>
                                <input type="text" id="nama-penerima" placeholder="Contoh: Olie" required>
                            </div>
                             <div class="form-group">
                                <label for="telp-penerima">No. Telp Penerima</label>
                                <input type="text" id="telp-penerima">
                            </div>
                        </div>
                        
                        <h3>Detail Barang</h3>
                        <div class="form-group">
                            <label for="isi-barang">Isi Sesuai Pengakuan</label>
                            <textarea id="isi-barang" rows="3" placeholder="Contoh u/ Kapal: Dekor(4), KBC(3)"></textarea>
                        </div>
                        <div class="form-group" id="group-merek">
                            <label for="merek-barang">Merek (Opsional)</label>
                            <input type="text" id="merek-barang" placeholder="Contoh: Super King, AB, dll">
                        </div>

                        <div class="form-row">
                            <div class="form-group" id="group-jumlah-koli">
                                <label for="jumlah-koli">Jumlah Koli (otomatis)</label>
                                <input type="number" id="jumlah-koli" readonly>
                            </div>
                            <div class="form-group" id="group-total-berat">
                                <label for="berat-barang">Total Berat (kg)</label>
                                <input type="number" id="berat-barang">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ongkos-kirim">Ongkos Kirim (Rp) (otomatis)</label>
                            <input type="text" id="ongkos-kirim" readonly>
                        </div>

                        <button type="submit" class="submit-button">Simpan Data Resi</button>
                    </form>
                </div>
            </div>
        </main>
        
        <div id="footer-placeholder"></div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
    <script src="form-handler.js"></script>
</body>
</html>
